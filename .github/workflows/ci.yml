name: NovaPass CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  contracts:
    name: Rust contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli --version 21.0.0

      - name: Build WASM (subscription)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release -p subscription

      - name: Lint
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Test
        working-directory: contracts
        run: cargo test --workspace
      - name: Build WASM (content_gate)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release -p content_gate

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            contracts/target/wasm32-unknown-unknown/release/subscription.wasm
            contracts/target/wasm32-unknown-unknown/release/content_gate.wasm

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_SUBSCRIPTION_CONTRACT_ID: ${{ secrets.SUBSCRIPTION_CONTRACT_ID || '' }}
          VITE_CONTENT_GATE_CONTRACT_ID: ${{ secrets.CONTENT_GATE_CONTRACT_ID || '' }}
          VITE_STELLAR_NETWORK: testnet
          VITE_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-vercel:
    name: Deploy to Vercel
    needs: frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_SUBSCRIPTION_CONTRACT_ID: ${{ secrets.SUBSCRIPTION_CONTRACT_ID || '' }}
          VITE_CONTENT_GATE_CONTRACT_ID: ${{ secrets.CONTENT_GATE_CONTRACT_ID || '' }}
          VITE_STELLAR_NETWORK: testnet
          VITE_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: npm run build

      - name: Check Vercel config
        id: vercel_config
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        if: steps.vercel_config.outputs.enabled == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"

  deploy-testnet:
    name: Deploy to Stellar Testnet
    needs: [contracts, frontend]
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secret
        id: deploy_config
        run: |
          if [ -n "$SOROBAN_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_SECRET_KEY }}

      - name: Install Rust
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Soroban CLI
        if: steps.deploy_config.outputs.enabled == 'true'
        run: cargo install --locked soroban-cli --version 21.0.0

      - name: Download WASM
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: artifacts

      - name: Configure Soroban identity
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          echo "${{ secrets.SOROBAN_SECRET_KEY }}" | soroban keys add deployer --secret-key -

      - name: Deploy subscription
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: artifacts
        run: |
          ID=$(soroban contract deploy \
            --wasm subscription.wasm \
            --source deployer \
            --network testnet)
          echo "SUBSCRIPTION_ID=$ID" >> $GITHUB_ENV
          echo "Subscription contract deployed: $ID"
          echo "$ID" > subscription_address.txt

      - name: Deploy content_gate
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: artifacts
        run: |
          ID=$(soroban contract deploy \
            --wasm content_gate.wasm \
            --source deployer \
            --network testnet)
          echo "CONTENT_GATE_ID=$ID" >> $GITHUB_ENV
          echo "Content gate contract deployed: $ID"
          echo "$ID" > content_gate_address.txt

      - name: Upload deployment addresses
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-addresses
          path: artifacts/*.txt
